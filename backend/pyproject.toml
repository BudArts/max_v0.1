[project]
name = "uchusai-backend"
version = "0.1.0"
description = "ИИ-наставник школьника в мессенджере MAX"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "PyJWT==2.15.1",
    "cryptography==50.0.1",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
    "structlog==26.1.0",
    "email-validator==2.3.0",
    "Pillow==12.3.0",
    "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "aiosqlite==0.22.1",
    "respx==0.23.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "types-PyJWT",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "B017"]
"tests/conftest.py" = ["E402"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
