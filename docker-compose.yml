name: uchusai

x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-Учусь.ai}
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  API_PREFIX: ${API_PREFIX:-/api/v1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:app@postgres:5432/app}
  DB_ECHO: ${DB_ECHO:-false}
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-please-change-0123456789}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-dev-only-field-key-please-change-0123456789}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
  MINIAPP_AUTH_WINDOW_SECONDS: ${MINIAPP_AUTH_WINDOW_SECONDS:-3600}
  DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
  MAX_TRANSPORT: ${MAX_TRANSPORT:-polling}
  MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
  MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-dev-only-webhook-secret-please-change-0123}
  MAX_CA_BUNDLE: ${MAX_CA_BUNDLE:-/etc/ssl/uchusai/russian_trusted_ca.pem}
  MAX_REQUEST_TIMEOUT: ${MAX_REQUEST_TIMEOUT:-15}
  MAX_VERIFY_SSL: ${MAX_VERIFY_SSL:-true}
  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
  GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
  GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
  GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-https://gigachat.devices.sberbank.ru/api/v1}
  GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
  GIGACHAT_TIMEOUT: ${GIGACHAT_TIMEOUT:-45}
  GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-/etc/ssl/uchusai/russian_trusted_ca.pem}
  GIGACHAT_ENABLED: ${GIGACHAT_ENABLED:-false}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-20}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-1095}
  PERSONAL_DATA_RETENTION_DAYS: ${PERSONAL_DATA_RETENTION_DAYS:-365}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      [
        "postgres",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
        "-c",
        "log_connections=on",
        "-c",
        "log_disconnections=on",
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SYNC_POLICIES: ${SYNC_POLICIES:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      REGISTER_BOT_COMMANDS: ${REGISTER_BOT_COMMANDS:-true}
    volumes:
      - ./deploy/certs:/etc/ssl/uchusai:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    environment:
      <<: *backend-env
      MAX_TRANSPORT: disabled
      RUN_MIGRATIONS: "false"
      SYNC_POLICIES: "false"
      SEED_DEMO: "false"
      REGISTER_BOT_COMMANDS: "false"
    volumes:
      - ./deploy/certs:/etc/ssl/uchusai:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  proxy:
    build:
      context: .
      dockerfile: ./deploy/nginx/Dockerfile
      args:
        VITE_DEV_LOGIN: ${DEV_LOGIN_ENABLED:-true}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      SSL_ENABLED: ${SSL_ENABLED:-false}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on:
      - backend
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
